; ============================================================================
;  PlatformIO 配置（仅供参考 —— 当前不可用！）
; ----------------------------------------------------------------------------
;  [警告] PlatformIO 官方 framework-arduinoespressif32 包（含最新 3.20017）的
;          variants/ 目录里【没有 ESP32-C6】，且所有 C6 板定义只列 espidf，
;          因此 PIO 当前【无法编译 ESP32-C6 的 Arduino 固件】。
;  [建议] 真机烧录请用 Arduino CLI 或 Arduino IDE（见 docs/13-烧录指南.md）。
;          一键工具 flash_macos.command / flash_windows.bat 已基于 Arduino CLI。
;  （保留此文件仅供将来 PIO 支持 C6 时参考，勿用于当前烧录。）
; ============================================================================
;
; PlatformIO project for OpenLoop Insulin Pump firmware
; Board : Waveshare ESP32-C6-LCD-1.47 (SKU 28563)
; MCU    : ESP32-C6 (4MB Flash, NO PSRAM)
; Frame  : Arduino (Arduino-ESP32 3.x)
; Upload : built-in USB (USB-CDC), no external USB-UART chip required
;
; Build / flash:
;   pio run                      ; compile only
;   pio run -t upload           ; compile + flash via built-in USB
;   pio run -t upload -e esp32-c6-aaps   ; AAPS Dana-i impersonation variant
;   pio device monitor          ; serial log @ 115200
;
; NOTE: This is a TEACHING / PROTOTYPE project. NEVER use on a human body.
;       On real hardware use ONLY an EMPTY syringe filled with WATER.

[platformio]
default_envs = esp32-c6

[env:esp32-c6]
platform = https://github.com/platformio/platform-espressif32.git
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
upload_protocol = esp-builtin-usb
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -Isrc
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
lib_deps =
    lvgl@9.5.0
    NimBLE-Arduino
    arduino-gfx

; AAPS Dana-i impersonation variant (see config.h section 15 / docs/12).
; Enables BLE name "DANxxxxxAB" and FFF0/FFF1/FFF2 service so AndroidAPS
; drives the pump as a Dana-i. Still teaching-only, never for human use.
[env:esp32-c6-aaps]
extends = env:esp32-c6
build_flags =
    -Isrc
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D USE_AAPS_DANA
